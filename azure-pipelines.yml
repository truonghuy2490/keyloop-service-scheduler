
trigger:
  branches:
    include:
      - chore/deployment-setup
  paths:
    include:
      - backend/**
      - azure-pipelines.yml

pool:
  vmImage: ubuntu-latest

stages:
  # ==========================================
  # STAGE 1: BUILD AND TEST BACKEND
  # ==========================================
  - stage: Build
    displayName: Build Backend

    jobs:
      - job: BuildBackend
        displayName: Build and Test Spring Boot

        steps:
          - checkout: self

          - task: JavaToolInstaller@0
            displayName: Set up Java 21
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - script: |
              set -eu
              java -version
              chmod +x mvnw
              ./mvnw --batch-mode --no-transfer-progress clean verify
            workingDirectory: backend
            displayName: Run Maven Build and Tests

          - script: |
              set -eu
              echo "=== Generated JAR files ==="
              find target -maxdepth 1 -type f -name '*.jar' -print
            workingDirectory: backend
            displayName: Verify Spring Boot JAR

          - script: |
              set -eu

              ARTIFACT_DIR="$(Build.ArtifactStagingDirectory)/backend"
              mkdir -p "$ARTIFACT_DIR"

              JAR_FILE=$(find target -maxdepth 1 \
                -type f \
                -name '*.jar' \
                ! -name '*.original' \
                ! -name '*-sources.jar' \
                ! -name '*-javadoc.jar' \
                | head -n 1)

              if [ -z "$JAR_FILE" ]; then
                echo "ERROR: Spring Boot JAR not found."
                exit 1
              fi

              cp "$JAR_FILE" "$ARTIFACT_DIR/app.jar"

              echo "Artifact prepared successfully."
              ls -lh "$ARTIFACT_DIR/app.jar"
            workingDirectory: backend
            displayName: Prepare Backend Artifact

          - task: PublishPipelineArtifact@1
            displayName: Publish Backend Artifact
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/backend'
              artifact: backend-package
              publishLocation: pipeline
 
  # ==========================================
  # STAGE 2: DEPLOY TO AZURE APP SERVICE
  # ==========================================
  - stage: Deploy
    displayName: Deploy Backend to Azure
    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: DeployBackend
        displayName: Deploy Spring Boot Application

        steps:
          # Download JAR from Build stage
          - download: current
            artifact: backend-package

          # Verify artifact
          - script: |
              set -eu

              JAR_FILE="$(Pipeline.Workspace)/backend-package/app.jar"

              if [ ! -s "$JAR_FILE" ]; then
                echo "ERROR: Backend JAR not found."
                exit 1
              fi

              echo "Backend artifact:"
              ls -lh "$JAR_FILE"
            displayName: Verify Backend Artifact

          # Deploy to existing Azure App Service
          - task: AzureWebApp@1
            displayName: Deploy Spring Boot JAR
            inputs:
              azureSubscription: 'sc-service-scheduler-azure'
              appType: 'webAppLinux'
              appName: 'service-scheduler-demo-huy'
              package: '$(Pipeline.Workspace)/backend-package/app.jar'

          # Verify deployment
          - script: |
              set -eu

              URL="https://service-scheduler-demo-huy-dyhnh7c5c6hde4en.swedencentral-01.azurewebsites.net/actuator/health"

              echo "Checking backend health..."

              for i in $(seq 1 18); do
                HTTP_CODE=$(curl --silent --show-error \
                  --max-time 20 \
                  --output /tmp/health.json \
                  --write-out "%{http_code}" \
                  "$URL") || HTTP_CODE="000"

                echo "Attempt $i: HTTP $HTTP_CODE"

                if [ "$HTTP_CODE" = "200" ] && \
                   grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"' /tmp/health.json; then
                  echo "Backend deployment successful."
                  cat /tmp/health.json
                  exit 0
                fi

                sleep 15
              done

              echo "ERROR: Backend health check failed."
              exit 1
            displayName: Verify Backend Health
